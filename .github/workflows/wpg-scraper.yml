name: WPG branches scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r wpg_scraper/requirements.txt
      - run: python wpg_scraper/scraper.py -o wpg_branches.xlsx
      - uses: actions/upload-artifact@v4
        with:
          name: wpg_branches
          path: wpg_branches.xlsx
